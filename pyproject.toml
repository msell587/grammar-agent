[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grammar-agent"
version = "0.1.0"
description = "LLM spelling and grammar checker with guardrails and human approval of every change."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
grammar-agent = "grammar_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grammar_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
